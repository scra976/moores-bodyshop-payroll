<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'self'; base-uri 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moore's Body Shop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-card">
      <div class="boot-mark" aria-hidden="true">M</div>
      <div>
        <strong>Moore's Body Shop</strong>
        <span>Loading shop books…</span>
      </div>
    </div>
  </div>

  <div id="app" class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="32" height="32">
            <rect x="1" y="1" width="30" height="30" rx="8" fill="#3b6fd0"/>
            <path d="M9 20.5L14.2 11h3.1L12 22H9v-1.5zm7.2 0L21.5 11H24L18.8 22h-2.6v-1.5z" fill="#fff"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">Moore's Body Shop</div>
          <div class="brand-sub">BOOKS</div>
        </div>
      </div>

      <nav class="nav" aria-label="Main">
        <button type="button" class="nav-item is-active" data-nav="dashboard">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
          Dashboard
        </button>
        <button type="button" class="nav-item" data-nav="ar">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
          AR
        </button>
        <button type="button" class="nav-item" data-nav="ap">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
          AP
        </button>
        <button type="button" class="nav-item" data-nav="gl">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/></svg>
          General Ledger
        </button>
        <button type="button" class="nav-item" data-nav="inventory">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20 2H4c-1 0-2 .9-2 2v3.01c0 .72.43 1.34 1 1.69V20c0 1.1 1.1 2 2 2h14c.9 0 2-.9 2-2V8.7c.57-.35 1-.97 1-1.69V4c0-1.1-1-2-2-2zm-5 12H9v-2h6v2zm5-7H4V4h16v3z"/></svg>
          Inventory
        </button>
        <button type="button" class="nav-item" data-nav="reports">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11zM8 12h8v2H8zm0 4h8v2H8z"/></svg>
          Reports
        </button>
        <div class="nav-group" data-payroll-group>
          <button type="button" class="nav-item" data-nav="employees">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            Payroll
          </button>
          <div class="nav-sub">
            <button type="button" class="nav-item nav-subitem" data-nav="employees">Employees</button>
            <button type="button" class="nav-item nav-subitem" data-nav="add">Add employee</button>
            <button type="button" class="nav-item nav-subitem" data-nav="timeclocks">Time clocks</button>
            <button type="button" class="nav-item nav-subitem" data-nav="payroll">Run payroll</button>
            <button type="button" class="nav-item nav-subitem" data-nav="payroll-settings">Payroll settings</button>
          </div>
        </div>
      </nav>

      <div class="sidebar-bottom">
        <button type="button" class="nav-item" data-nav="settings">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.61-.22l-2.39.96a7.007 7.007 0 00-1.63-.94l-.36-2.54a.49.49 0 00-.49-.42h-3.84a.49.49 0 00-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 00-.61.22L2.74 8.84a.5.5 0 00.12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.86 13.94a.5.5 0 00-.12.64l1.92 3.32c.12.22.39.3.61.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.05.24.24.42.49.42h3.84c.24 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.49 0 .61-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/></svg>
          Settings
        </button>
        <div class="shop-address">821 Kabrich Street<br>Blacksburg, VA 24060</div>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <div>
          <h1 id="page-title">Dashboard</h1>
          <p id="page-sub" class="page-sub">Shop snapshot</p>
        </div>
        <div class="topbar-right">
          <span id="enc-chip" class="chip chip-ok">Encrypted</span>
          <span class="chip">Moore's Body Shop</span>
        </div>
      </header>
      <div id="view-root" class="view-root"></div>
    </div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-modal-cancel></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title">Confirm</h3>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="tax.js"></script>
  <script src="reports.js"></script>
  <script src="books.js"></script>
  <script src="banking.js"></script>
  <script src="books-ui.js"></script>
  <script src="qb-import.js"></script>
  <script src="app.js"></script>
</body>
</html>
